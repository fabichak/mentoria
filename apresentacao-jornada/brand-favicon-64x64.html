<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:64px;height:64px;overflow:hidden;background:transparent}
  .mark{position:relative;width:64px;height:64px;border-radius:16px;background:linear-gradient(160deg,#111214,#0a0a0a);display:flex;align-items:center;justify-content:center}
  .ring{position:absolute;inset:0;border-radius:16px;border:1.5px solid rgba(45,125,210,.4)}
  .dot{width:24px;height:24px;border-radius:50%;background:#2d7dd2;box-shadow:0 0 16px rgba(45,125,210,.8)}
</style></head>
<body>
<div class="mark"><div class="ring"></div><div class="dot"></div></div>
</body></html>
