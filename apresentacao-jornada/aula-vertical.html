<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aula — DevAdvance.club (vertical 1080×1412)</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="vertical.css">
</head>
<body>
<div id="deck"></div>
<script src="aulas/manifest.js"></script>
<script>
  // carrega aulas/<id>.js conforme ?a=0.1 — document.write mantém a ordem (dados antes do motor, funciona em file://)
  (function(){
    var id = new URLSearchParams(location.search).get('a') || (window.AULAS[0] && window.AULAS[0].id);
    var meta = (window.AULAS||[]).find(function(a){ return a.id === id; });
    if (meta) document.title = meta.id + ' — ' + meta.titulo;
    document.write('<script src="aulas/' + encodeURIComponent(id) + '.js"><\/script>');
  })();
</script>
<script src="deck.js"></script>
</body>
</html>
