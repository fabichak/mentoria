<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:720px;height:128px;overflow:hidden;background:transparent;font-family:-apple-system,"Segoe UI","Helvetica Neue",sans-serif}
  .wrap{width:720px;height:128px;display:flex;align-items:center;gap:22px;padding:0 28px}
  .mark{position:relative;width:64px;height:64px;flex-shrink:0;border-radius:18px;background:linear-gradient(160deg,#111214,#0a0a0a);border:1px solid rgba(245,245,240,.14);display:flex;align-items:center;justify-content:center}
  .mark .dot{width:22px;height:22px;border-radius:50%;background:#2d7dd2;box-shadow:0 0 18px rgba(45,125,210,.7)}
  .mark .ring{position:absolute;inset:0;border-radius:18px;border:1px solid rgba(45,125,210,.35)}
  .text{display:flex;flex-direction:column;justify-content:center}
  .tag{font-family:ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:#2fd4a5;margin-bottom:4px}
  .word{font-size:40px;font-weight:700;letter-spacing:-.02em;color:#f5f5f0;line-height:1}
  .word .accent{color:#2d7dd2}
  .word sup{font-size:16px;font-weight:600;color:#a7a9ad;margin-left:2px}
</style></head>
<body>
<div class="wrap">
  <div class="mark"><div class="ring"></div><div class="dot"></div></div>
  <div class="text">
    <div class="tag">Mentoria</div>
    <div class="word"><span class="accent">Code</span> Leadership<sup>&trade;</sup></div>
  </div>
</div>
</body></html>
