<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff3db4"/>
    </marker>
    <marker id="setaC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ff"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#0a1220"/>

  <text x="600" y="56" text-anchor="middle" fill="#8aa0c6" font-size="22" letter-spacing="4">O FRAMEWORK EM 4 BLOCOS</text>

  <!-- bloco 1: META -->
  <rect x="50" y="100" rx="12" width="240" height="150" fill="rgba(34,211,255,.06)" stroke="#22d3ff" stroke-width="2"/>
  <text x="170" y="150" text-anchor="middle" fill="#22d3ff" font-size="28" font-weight="800">1 · META</text>
  <text x="170" y="188" text-anchor="middle" fill="#eaf2ff" font-size="20">direção de vida</text>
  <text x="170" y="216" text-anchor="middle" fill="#8aa0c6" font-size="18">o que o trabalho te dá</text>

  <!-- bloco 2: ESTADO ATUAL -->
  <rect x="340" y="100" rx="12" width="240" height="150" fill="rgba(34,211,255,.06)" stroke="#22d3ff" stroke-width="2"/>
  <text x="460" y="150" text-anchor="middle" fill="#22d3ff" font-size="26" font-weight="800">2 · ESTADO ATUAL</text>
  <text x="460" y="188" text-anchor="middle" fill="#eaf2ff" font-size="20">diagnóstico honesto</text>
  <text x="460" y="216" text-anchor="middle" fill="#8aa0c6" font-size="18">escrito, não “na cabeça”</text>

  <!-- bloco 3: OBJETIVO -->
  <rect x="630" y="100" rx="12" width="240" height="150" fill="rgba(34,211,255,.06)" stroke="#22d3ff" stroke-width="2"/>
  <text x="750" y="150" text-anchor="middle" fill="#22d3ff" font-size="26" font-weight="800">3 · OBJETIVO</text>
  <text x="750" y="188" text-anchor="middle" fill="#eaf2ff" font-size="20">12–24 meses</text>
  <text x="750" y="216" text-anchor="middle" fill="#8aa0c6" font-size="18">específico e verificável</text>

  <!-- bloco 4: PASSOS -->
  <rect x="920" y="100" rx="12" width="240" height="150" fill="rgba(255,61,180,.06)" stroke="#ff3db4" stroke-width="2"/>
  <text x="1040" y="150" text-anchor="middle" fill="#ff3db4" font-size="26" font-weight="800">4 · PASSOS</text>
  <text x="1040" y="188" text-anchor="middle" fill="#eaf2ff" font-size="20">a lacuna quebrada</text>
  <text x="1040" y="216" text-anchor="middle" fill="#8aa0c6" font-size="18">ações de 30–90 dias</text>

  <!-- setas entre blocos -->
  <path d="M292 175 L 336 175" fill="none" stroke="#ff3db4" stroke-width="3" marker-end="url(#seta)"/>
  <path d="M582 175 L 626 175" fill="none" stroke="#ff3db4" stroke-width="3" marker-end="url(#seta)"/>
  <path d="M872 175 L 916 175" fill="none" stroke="#ff3db4" stroke-width="3" marker-end="url(#seta)"/>

  <!-- ligação PASSOS -> loop -->
  <path d="M1040 252 L 1040 330 L 600 330 L 600 380" fill="none" stroke="#22d3ff" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#setaC)"/>
  <text x="830" y="316" text-anchor="middle" fill="#8aa0c6" font-size="19">cada ciclo de 30–90 dias = uma volta do loop</text>

  <!-- loop do método -->
  <g>
    <rect x="120" y="400" rx="10" width="200" height="80" fill="rgba(34,211,255,.06)" stroke="#22d3ff" stroke-width="2"/>
    <text x="220" y="448" text-anchor="middle" fill="#eaf2ff" font-size="24" font-weight="700">MAPEAR</text>

    <rect x="380" y="400" rx="10" width="200" height="80" fill="rgba(34,211,255,.06)" stroke="#22d3ff" stroke-width="2"/>
    <text x="480" y="448" text-anchor="middle" fill="#eaf2ff" font-size="24" font-weight="700">PRIORIZAR</text>

    <rect x="640" y="400" rx="10" width="220" height="80" fill="rgba(34,211,255,.06)" stroke="#22d3ff" stroke-width="2"/>
    <text x="750" y="440" text-anchor="middle" fill="#eaf2ff" font-size="24" font-weight="700">AGIR</text>
    <text x="750" y="468" text-anchor="middle" fill="#8aa0c6" font-size="18">e medir</text>

    <rect x="920" y="400" rx="10" width="200" height="80" fill="rgba(255,61,180,.06)" stroke="#ff3db4" stroke-width="2"/>
    <text x="1020" y="448" text-anchor="middle" fill="#eaf2ff" font-size="24" font-weight="700">MOSTRAR</text>

    <path d="M322 440 L 376 440" fill="none" stroke="#22d3ff" stroke-width="2.5" marker-end="url(#setaC)"/>
    <path d="M582 440 L 636 440" fill="none" stroke="#22d3ff" stroke-width="2.5" marker-end="url(#setaC)"/>
    <path d="M862 440 L 916 440" fill="none" stroke="#22d3ff" stroke-width="2.5" marker-end="url(#setaC)"/>
    <!-- volta -->
    <path d="M1020 482 L 1020 540 L 220 540 L 220 486" fill="none" stroke="#ff3db4" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#seta)"/>
    <text x="620" y="568" text-anchor="middle" fill="#8aa0c6" font-size="19">↻ próxima volta: régua mais alta</text>
  </g>
</svg>
