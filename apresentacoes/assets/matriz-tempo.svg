<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="1200" height="640" fill="#0a1220"/>

  <!-- eixos -->
  <text x="620" y="46" text-anchor="middle" fill="#8aa0c6" font-size="22" letter-spacing="4">IMPORTANTE ↑</text>
  <text x="130" y="612" fill="#8aa0c6" font-size="22" letter-spacing="4">← NÃO-URGENTE</text>
  <text x="1110" y="612" text-anchor="end" fill="#8aa0c6" font-size="22" letter-spacing="4">URGENTE →</text>

  <!-- Q: importante / não-urgente (destaque) -->
  <rect x="120" y="70" rx="14" width="490" height="250" fill="rgba(255,61,180,.08)" stroke="#ff3db4" stroke-width="3"/>
  <text x="365" y="120" text-anchor="middle" fill="#ff3db4" font-size="30" font-weight="800">SUA CARREIRA MORA AQUI</text>
  <text x="365" y="160" text-anchor="middle" fill="#eaf2ff" font-size="22">bloco de carreira · KPI da lacuna</text>
  <text x="365" y="192" text-anchor="middle" fill="#eaf2ff" font-size="22">mentorar o time · Problem Journal</text>
  <text x="365" y="236" text-anchor="middle" fill="#8aa0c6" font-size="20">é o que a agenda reativa engole primeiro</text>
  <text x="365" y="290" text-anchor="middle" fill="#ff3db4" font-size="24" font-weight="700">AGENDAR E PROTEGER</text>

  <!-- Q: importante / urgente -->
  <rect x="630" y="70" rx="14" width="490" height="250" fill="rgba(34,211,255,.06)" stroke="#22d3ff" stroke-width="2"/>
  <text x="875" y="120" text-anchor="middle" fill="#22d3ff" font-size="30" font-weight="800">FAZER AGORA</text>
  <text x="875" y="160" text-anchor="middle" fill="#eaf2ff" font-size="22">incidente em produção</text>
  <text x="875" y="192" text-anchor="middle" fill="#eaf2ff" font-size="22">deadline real de entrega</text>
  <text x="875" y="290" text-anchor="middle" fill="#8aa0c6" font-size="24" font-weight="700">RESOLVER — E PREVENIR</text>

  <!-- Q: não importante / não-urgente -->
  <rect x="120" y="340" rx="14" width="490" height="250" fill="rgba(61,155,255,.04)" stroke="#3d9bff" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="365" y="390" text-anchor="middle" fill="#3d9bff" font-size="30" font-weight="800">ELIMINAR</text>
  <text x="365" y="430" text-anchor="middle" fill="#eaf2ff" font-size="22">reunião sem pauta</text>
  <text x="365" y="462" text-anchor="middle" fill="#eaf2ff" font-size="22">scroll infinito de Slack</text>
  <text x="365" y="560" text-anchor="middle" fill="#8aa0c6" font-size="24" font-weight="700">CORTAR SEM DÓ</text>

  <!-- Q: não importante / urgente -->
  <rect x="630" y="340" rx="14" width="490" height="250" fill="rgba(61,155,255,.04)" stroke="#3d9bff" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="875" y="390" text-anchor="middle" fill="#3d9bff" font-size="30" font-weight="800">DELEGAR / NEGOCIAR</text>
  <text x="875" y="430" text-anchor="middle" fill="#eaf2ff" font-size="22">pedido urgente de outro time</text>
  <text x="875" y="462" text-anchor="middle" fill="#eaf2ff" font-size="22">"só uma perguntinha rápida"</text>
  <text x="875" y="560" text-anchor="middle" fill="#8aa0c6" font-size="24" font-weight="700">"NÃO" COM ALTERNATIVA</text>
</svg>
