<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff3db4"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#0a1220"/>

  <!-- nó central -->
  <rect x="110" y="250" rx="14" width="300" height="140" fill="rgba(255,61,180,.07)" stroke="#ff3db4" stroke-width="3"/>
  <text x="260" y="308" text-anchor="middle" fill="#eaf2ff" font-size="30" font-weight="800">PROBLEM</text>
  <text x="260" y="348" text-anchor="middle" fill="#eaf2ff" font-size="30" font-weight="800">JOURNAL</text>

  <!-- setas -->
  <path d="M420 290 C 540 290, 560 115, 660 115" fill="none" stroke="#ff3db4" stroke-width="3" marker-end="url(#seta)"/>
  <path d="M420 315 C 540 315, 560 265, 660 265" fill="none" stroke="#ff3db4" stroke-width="3" marker-end="url(#seta)"/>
  <path d="M420 340 C 540 340, 560 405, 660 405" fill="none" stroke="#ff3db4" stroke-width="3" marker-end="url(#seta)"/>
  <path d="M420 365 C 540 365, 560 545, 660 545" fill="none" stroke="#ff3db4" stroke-width="3" marker-end="url(#seta)"/>

  <!-- fases -->
  <rect x="670" y="70" rx="12" width="450" height="95" fill="rgba(34,211,255,.06)" stroke="#22d3ff" stroke-width="2"/>
  <text x="700" y="110" fill="#22d3ff" font-size="26" font-weight="800" letter-spacing="2">PREPARAR</text>
  <text x="700" y="144" fill="#eaf2ff" font-size="21">padrões nas suas lacunas</text>

  <rect x="670" y="220" rx="12" width="450" height="95" fill="rgba(34,211,255,.06)" stroke="#22d3ff" stroke-width="2"/>
  <text x="700" y="260" fill="#22d3ff" font-size="26" font-weight="800" letter-spacing="2">AGIR</text>
  <text x="700" y="294" fill="#eaf2ff" font-size="21">hipóteses viram plano</text>

  <rect x="670" y="360" rx="12" width="450" height="95" fill="rgba(34,211,255,.06)" stroke="#22d3ff" stroke-width="2"/>
  <text x="700" y="400" fill="#22d3ff" font-size="26" font-weight="800" letter-spacing="2">MOSTRAR</text>
  <text x="700" y="434" fill="#eaf2ff" font-size="21">material pronto pra 1:1 e promoção</text>

  <rect x="670" y="500" rx="12" width="450" height="95" fill="rgba(34,211,255,.06)" stroke="#22d3ff" stroke-width="2"/>
  <text x="700" y="540" fill="#22d3ff" font-size="26" font-weight="800" letter-spacing="2">OTIMIZAR</text>
  <text x="700" y="574" fill="#eaf2ff" font-size="21">reler o trimestre e ver o que funcionou</text>

  <text x="260" y="470" text-anchor="middle" fill="#8aa0c6" font-size="20">10 min/semana</text>
  <text x="260" y="500" text-anchor="middle" fill="#8aa0c6" font-size="20">alimenta o método inteiro</text>
</svg>
